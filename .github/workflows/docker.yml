# Builds the Docker image for every published release and pushes it to the GitHub Container Registry
# (ghcr.io/<owner>/<repo>), where it shows up under "Packages" of this repository.
name: Docker image

on:
  release:
    types: [published]
  workflow_dispatch:   # rebuild the image of an existing release
    inputs:
      tag:
        description: Release tag to build, e.g. v2.0.0
        required: true
      latest:
        description: Also tag the image as latest
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      LATEST: ${{ (github.event_name == 'release' && !github.event.release.prerelease) || inputs.latest == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5   # also sets org.opencontainers.image.source, which links the package to this repo
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ env.LATEST }}
          labels: |
            org.opencontainers.image.title=Open WLAN Dashboard
            org.opencontainers.image.description=Local read-only WLAN health dashboard for a FRITZ!Box mesh
      - uses: docker/build-push-action@v6   # the Dockerfile runs the self-test while building
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
